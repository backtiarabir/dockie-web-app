<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Dockiee</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: var(--dockie-light-gray);">
    
    <div id="navbar-placeholder"></div>

    <div class="container">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <form id="form-login">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                    <div class="text-center" style="margin-top: 1rem; font-size: 0.9rem;">
                        <a href="#" style="color: var(--dockie-muted);">Forgot Password?</a>
                    </div>
                </form>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" class="hidden">
                 <form id="form-signup">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="signup-name" class="form-input" placeholder="Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Student Email</label>
                        <input type="email" id="signup-email" class="form-input" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">University</label>
                        <input type="text" id="signup-university" class="form-input" placeholder="e.g. MIT" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="signup-role-printer">
                        <label for="signup-role-printer" style="margin:0; cursor:pointer;">I also own a printer (Sign up as Printer)</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </form>
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/login.js"></script>
    <script>
        // Init Shared Components
        // Special case for Login: The simple navbar in original file was just Home link. 
        // We can reuse the full navbar or override it. The plan implied reusing the standard component.
        // Let's use the standard component for consistency, index 7 corresponds to Login button but we are on login page.
        Components.loadNavbar(); 
    </script>
</body>
</html>
